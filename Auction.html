
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSC - Player Management</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  background: #f6f3f7;
  color: #24212a;
}

.layout {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 235px;
  flex-shrink: 0;
  background: white;
  padding: 25px 16px;
  border-right: 1px solid #eee8ee;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  margin: 0 10px 35px;
}

.logo span { color: #ed2450; }

.menu-title {
  font-size: 10px;
  color: #aaa3ad;
  font-weight: bold;
  margin: 25px 10px 10px;
  letter-spacing: 1px;
}

.menu a {
  display: block;
  text-decoration: none;
  color: #77717c;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 4px;
}

.menu a:hover,
.menu a.active {
  background: #fff0f4;
  color: #ed2450;
}

main {
  flex: 1;
  min-width: 0;
  padding: 30px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 35px;
}

.tournament {
  background: white;
  padding: 12px 17px;
  border: 1px solid #eee5eb;
  border-radius: 25px;
  font-size: 13px;
}

.back {
  text-decoration: none;
  color: #ed2450;
  font-size: 13px;
}

.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 22px;
}

h1 { font-size: 25px; margin: 0; }

button {
  cursor: pointer;
  padding: 10px 14px;
  border-radius: 7px;
  border: 1px solid #ed2450;
  background: white;
  color: #ed2450;
  font-weight: 600;
}

button.primary {
  background: #ed2450;
  color: white;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 13px;
  margin-bottom: 22px;
}

.stat {
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 4px 15px #33203308;
}

.stat small {
  display: block;
  color: #88818a;
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 8px;
}

.stat strong { font-size: 27px; }

.filters {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 10px;
  background: white;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 20px;
}

input, select {
  min-width: 0;
  width: 100%;
  padding: 12px;
  border: 1px solid #eee0e7;
  border-radius: 8px;
  background: white;
}

.player-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(245px, 280px));
  gap: 17px;
}

.player {
  background: white;
  padding: 18px;
  border-radius: 12px;
  border-top: 4px solid #3268ff;
  box-shadow: 0 5px 20px #33203308;
}

.player-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
  margin-bottom: 18px;
}

.status {
  font-size: 10px;
  color: #00986a;
  background: #e2f8ef;
  border-radius: 20px;
  padding: 5px 8px;
}

.identity {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #e9edff;
  display: grid;
  place-items: center;
  color: #3457b7;
  font-size: 17px;
  font-weight: bold;
}

.identity h2 { font-size: 17px; margin: 0 0 7px; }

.role {
  font-size: 10px;
  color: #3478f6;
  background: #edf3ff;
  padding: 5px 8px;
  border-radius: 20px;
}

.details {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: #f8f5f8;
  border: 1px solid #f0e2e9;
  border-radius: 8px;
  padding: 12px 4px;
  text-align: center;
  margin-bottom: 17px;
}

.details small {
  display: block;
  font-size: 9px;
  color: #8a838d;
  margin-bottom: 6px;
}

.details strong {
  font-size: 11px;
  overflow-wrap: anywhere;
}

.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 17px;
}

.price-row small {
  display: block;
  font-size: 10px;
  color: #88818a;
  margin-bottom: 5px;
}

.card-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.card-buttons button { padding: 9px 5px; }

.empty {
  padding: 30px;
  background: white;
  border-radius: 10px;
  color: #77717c;
}

footer {
  margin-top: 30px;
  color: #8a838d;
  font-size: 11px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #0008;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 10;
}

.modal.open { display: flex; }

.modal-content {
  width: min(520px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  border-radius: 14px;
  padding: 24px;
}

.modal-content h2 { margin-top: 0; }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}

.form-grid label {
  font-size: 12px;
  color: #77717c;
}

.form-grid input,
.form-grid select { margin-top: 6px; }

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}

@media (max-width: 850px) {
  .sidebar { width: 175px; }
  main { padding: 20px 14px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .filters { grid-template-columns: 1fr 1fr; }
  .filters input { grid-column: 1 / -1; }
}

@media (max-width: 560px) {
  .layout { display: block; }
  .sidebar { width: 100%; padding: 15px; }
  .logo { margin-bottom: 15px; }
  .menu-title { display: none; }
  .menu { display: flex; flex-wrap: wrap; gap: 5px; }
  .menu a { padding: 9px; font-size: 12px; }
  .topbar { margin-bottom: 25px; }
  .stats { gap: 8px; }
  .stat { padding: 12px; }
  .stat strong { font-size: 23px; }
  .player-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="layout">

<aside class="sidebar">
  <div class="logo">🏏 <span>KSC</span> Hub</div>
  <div class="menu-title">MAIN</div>
  <nav class="menu">
    <a href="index.html">⌂ Home</a>
    <a href="index.html#events">🏆 Events</a>
    <a href="index.html#top10">🏅 Top 10</a>
  </nav>
  <div class="menu-title">TOURNAMENT</div>
  <nav class="menu">
    <a class="active" href="PlayerManagement.html">♙ Players</a>
    <a href="Auction.html">⚒ Auction</a>
  </nav>
</aside>

<main>
  <div class="topbar">
    <div class="tournament">🔴 <b>Karaikal Super League</b></div>
    <a class="back" href="index.html">← Back to KSC Home</a>
  </div>

  <div class="heading">
    <h1>Player Management</h1>
    <button class="primary" id="addButton">＋ Add Player</button>
  </div>

  <div class="stats">
    <div class="stat"><small>TOTAL PLAYERS</small><strong id="total">0</strong></div>
    <div class="stat"><small>APPROVED PLAYERS</small><strong id="approved">0</strong></div>
    <div class="stat"><small>PENDING REVIEW</small><strong id="pending">0</strong></div>
    <div class="stat"><small>REJECTED PLAYERS</small><strong id="rejected">0</strong></div>
  </div>

  <div class="filters">
    <input id="search" placeholder="⌕ Search player name...">
    <select id="statusFilter">
      <option value="">All Approval States</option>
      <option>Approved</option>
      <option>Pending</option>
      <option>Rejected</option>
    </select>
    <select id="roleFilter">
      <option value="">All Roles</option>
      <option>Batter</option>
      <option>Bowler</option>
      <option>All-rounder</option>
      <option>Wicket-keeper</option>
    </select>
  </div>

  <div id="players" class="player-grid"></div>

  <footer>
    Karaikal Sports Club · Player Management
  </footer>
</main>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="formTitle">Add Player</h2>
    <form id="playerForm">
      <div class="form-grid">
        <label>Player name *
          <input name="name" required>
        </label>
        <label>Age
          <input name="age" type="number" min="10" max="100">
        </label>
        <label>Role
          <select name="role">
            <option>Batter</option>
            <option>Bowler</option>
            <option>All-rounder</option>
            <option>Wicket-keeper</option>
          </select>
        </label>
        <label>Approval
          <select name="status">
            <option>Approved</option>
            <option>Pending</option>
            <option>Rejected</option>
          </select>
        </label>
        <label>Batting style
          <input name="batting" placeholder="Right Hand">
        </label>
        <label>Bowling style
          <input name="bowling" placeholder="None">
        </label>
        <label>Base price
          <input name="price" type="number" min="0" value="400">
        </label>
        <label>Auction status
          <select name="auction">
            <option>Unsold</option>
            <option>Sold</option>
          </select>
        </label>
      </div>
      <div class="form-actions">
        <button type="button" id="cancelButton">Cancel</button>
        <button class="primary" type="submit">Save Player</button>
      </div>
    </form>
  </div>
</div>

<script>
const STORAGE_KEY = "kscPlayers";
let players = [];
let editingId = null;

try {
  players = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (!Array.isArray(players)) players = [];
} catch {
  players = [];
}

const $ = id => document.getElementById(id);

function safe(text) {
  return String(text ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[char]);
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
}

function render() {
  $("total").textContent = players.length;
  $("approved").textContent =
    players.filter(p => p.status === "Approved").length;
  $("pending").textContent =
    players.filter(p => p.status === "Pending").length;
  $("rejected").textContent =
    players.filter(p => p.status === "Rejected").length;

  const query = $("search").value.toLowerCase();
  const status = $("statusFilter").value;
  const role = $("roleFilter").value;

  const filtered = players.filter(p =>
    p.name.toLowerCase().includes(query) &&
    (!status || p.status === status) &&
    (!role || p.role === role)
  );

  if (!filtered.length) {
    $("players").innerHTML =
      '<div class="empty">No players found. Click Add Player to register your first player.</div>';
    return;
  }

  $("players").innerHTML = filtered.map(p => `
    <article class="player">
      <div class="player-top">
        <span style="font-size:11px;color:#8a838d">KSC PLAYER</span>
        <span class="status">${safe(p.status.toUpperCase())}</span>
      </div>
      <div class="identity">
        <div class="avatar">${safe(p.name.trim().split(/\s+/).slice(0,2).map(n=>n[0]).join("").toUpperCase())}</div>
        <div>
          <h2>${safe(p.name)}</h2>
          <span class="role">${safe(p.role.toUpperCase())}</span>
        </div>
      </div>
      <div class="details">
        <div><small>AGE</small><strong>${safe(p.age || "—")}</strong></div>
        <div><small>BATTING</small><strong>${safe(p.batting || "—")}</strong></div>
        <div><small>BOWLING</small><strong>${safe(p.bowling || "—")}</strong></div>
      </div>
      <div class="price-row">
        <div><small>BASE PRICE</small><strong>CR ${Number(p.price || 0).toLocaleString()}</strong></div>
        <span class="status">${safe(p.auction.toUpperCase())}</span>
      </div>
      <div class="card-buttons">
        <button onclick="viewPlayer(${p.id})">View</button>
        <button onclick="editPlayer(${p.id})">Edit</button>
      </div>
    </article>
  `).join("");
}

function openForm(player) {
  $("playerForm").reset();
  editingId = player ? player.id : null;
  $("formTitle").textContent = player ? "Edit Player" : "Add Player";

  if (player) {
    for (const key of ["name","age","role","status","batting","bowling","price","auction"]) {
      $("playerForm").elements[key].value = player[key] ?? "";
    }
  } else {
    $("playerForm").elements.price.value = 400;
  }

  $("modal").classList.add("open");
}

function closeForm() {
  $("modal").classList.remove("open");
}

function viewPlayer(id) {
  const p = players.find(player => player.id === id);
  if (p) {
    alert(
      "Player: " + p.name +
      "\nAge: " + (p.age || "—") +
      "\nRole: " + p.role +
      "\nApproval: " + p.status +
      "\nBatting: " + (p.batting || "—") +
      "\nBowling: " + (p.bowling || "—") +
      "\nBase price: CR " + p.price +
      "\nAuction: " + p.auction
    );
  }
}

function editPlayer(id) {
  const player = players.find(p => p.id === id);
  if (player) openForm(player);
}

$("addButton").onclick = () => openForm(null);
$("cancelButton").onclick = closeForm;

$("modal").onclick = event => {
  if (event.target === $("modal")) closeForm();
};

$("playerForm").onsubmit = event => {
  event.preventDefault();
  const form = new FormData(event.target);
  const player = Object.fromEntries(form.entries());

  player.name = player.name.trim();
  player.age = Number(player.age) || "";
  player.price = Number(player.price) || 0;
  player.id = editingId ?? Date.now();

  if (editingId !== null) {
    players = players.map(p => p.id === editingId ? player : p);
  } else {
    players.push(player);
  }

  save();
  closeForm();
  render();
};

$("search").addEventListener("input", render);
$("statusFilter").addEventListener("change", render);
$("roleFilter").addEventListener("change", render);

render();
</script>
</body>
</html>
